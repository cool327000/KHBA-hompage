<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Schedule | KHBA</title><link rel="stylesheet" href="style.css"><style>.schedule-page{padding-top:58px}.scores-tabs{display:flex;align-items:flex-end;gap:30px;border-bottom:1px solid #d9dde1;width:max-content}.scores-tab{display:block;padding:0 1px 11px;font-size:16px;font-weight:700;line-height:1;color:#69717a}.scores-tab.active{color:#17202b;border-bottom:3px solid #2d343b;font-weight:900}.schedule-head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 18px}.schedule-head h1{margin:0;font-size:27px;font-weight:900}.schedule-season{font-size:11px;font-weight:900;letter-spacing:1px;color:#727c88}.schedule-list{border-top:1px solid #cfd5dc}.schedule-date{display:grid;grid-template-columns:100px 1fr;border-bottom:1px solid #dce1e6}.schedule-day{padding:22px 0}.dow{display:block;font-size:11px;font-weight:900;letter-spacing:1px;color:#7b8490;margin-bottom:5px}.num{font-size:29px;font-weight:900;color:#202a37}.schedule-games{padding:13px 0}.schedule-game{display:grid;grid-template-columns:1fr 100px 35px 1fr 160px;align-items:center;gap:12px;min-height:72px;padding:0 18px;border:1px solid #d8dde5;border-radius:5px;background:#fff}.schedule-team{font-size:14px;font-weight:900;color:#25303e}.schedule-team.away{text-align:right}.team-tag{display:block;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.7px;color:#89919b}.time{font-size:12px;font-weight:900;text-align:center}.vs{font-size:11px;font-weight:900;text-align:center;color:#b41e30}.meta{text-align:right;font-size:10px;font-weight:800;letter-spacing:.5px;color:#7d8792}@media(max-width:700px){.schedule-page{padding-top:36px}.schedule-date{grid-template-columns:72px 1fr}.schedule-game{grid-template-columns:1fr 55px 24px 1fr;padding:0 10px;gap:6px}.meta{display:none}.schedule-team{font-size:11px}.time{font-size:10px}}</style></head><body><header class="topbar"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>KHBA</span></a><nav class="nav"><a href="index.html">HOME</a><a class="active" href="scores.html">SCORES</a><a href="standings.html">STANDINGS</a><a href="news.html">NEWS</a><a href="teams.html">TEAMS</a></nav></div></header><main class="section schedule-page"><div class="container"><div class="scores-tabs"><a class="scores-tab" href="scores.html">Scores</a><a class="scores-tab active" href="schedule.html">Schedule</a></div><div class="schedule-head"><h1>AUGUST 2026</h1><span class="schedule-season">S1 · REGULAR SEASON</span></div><div class="schedule-list" id="scheduleList"></div></div></main><script>document.addEventListener('DOMContentLoaded',()=>{const games=[['SAT','15','HANSHIN TIGERS','CANBERRA CAVALRY'],['SUN','16','DOOSAN BEARS','LG TWINS'],['TUE','18','LG TWINS','HANSHIN TIGERS'],['WED','19','CANBERRA CAVALRY','DOOSAN BEARS']];document.getElementById('scheduleList').innerHTML=games.map(g=>`<section class="schedule-date"><div class="schedule-day"><span class="dow">${g[0]}</span><span class="num">${g[1]}</span></div><div class="schedule-games"><article class="schedule-game"><div class="schedule-team">${g[2]}<small class="team-tag">HOME</small></div><div class="time">21:30 KST</div><div class="vs">VS</div><div class="schedule-team away">${g[3]}<small class="team-tag">AWAY</small></div><div class="meta">KHBA STADIUM<br>REGULAR SEASON</div></article></div></section>`).join('')})</script></body></html>
