<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scores | KHBA</title><link rel="stylesheet" href="style.css"><style>
.scores-page{padding-top:58px}.scores-tabs{display:flex;align-items:flex-end;gap:30px;border-bottom:1px solid #d9dde1;width:max-content}.scores-tab{display:block;padding:0 1px 11px;font-size:16px;font-weight:700;line-height:1;color:#69717a}.scores-tab.active{color:#17202b;border-bottom:3px solid #2d343b;font-weight:900}.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}.game-wrap{min-width:0}.score-card{background:#fff;border:1px solid #d8dde5;border-radius:4px;overflow:hidden;transition:.18s ease}.score-card.open{border-bottom-left-radius:0;border-bottom-right-radius:0}.score-card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #e3e6eb;font-size:12px;font-weight:700;letter-spacing:.4px;color:#657080}.score-status{color:#687383}.score-line{display:grid;grid-template-columns:minmax(190px,1fr) 42px 42px 42px;align-items:center}.score-line>div{padding:10px 14px}.score-line:not(:last-of-type){border-bottom:1px solid #edf0f3}.score-team{font-weight:800;font-size:15px;color:#202936}.score-team small{display:block;margin-top:4px;font-size:11px;font-weight:600;color:#7b8490}.score-stat-head{font-size:11px;font-weight:800;text-align:center;color:#6c7580}.score-stat{font-size:15px;font-weight:800;text-align:center}.score-card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e3e6eb;padding:0 16px}.score-card-foot{padding:10px 0;font-size:11px;font-weight:700;color:#7b8490;letter-spacing:.3px}.box-trigger{border:0;background:transparent;padding:8px 0;font-size:10px;font-weight:900;letter-spacing:.5px;color:#3d4753;cursor:pointer}.box-trigger:hover{color:#b51d2f}.box-trigger span{margin-left:5px;font-size:13px}.box-score{display:none;border:1px solid #d8dde5;border-top:0;background:#f8f9fa;padding:14px 16px;border-radius:0 0 4px 4px}.game-wrap.open .box-score{display:block}.box-score-title{font-size:11px;font-weight:900;letter-spacing:.8px;color:#687383;margin-bottom:10px}.box-table{width:100%;border-collapse:collapse;font-size:12px}.box-table th,.box-table td{text-align:center;padding:7px 4px;border-top:1px solid #e2e6ea}.box-table th{font-size:10px;color:#6c7580;font-weight:800}.box-table th:first-child,.box-table td:first-child{text-align:left;font-weight:800;padding-left:0}.box-table td{font-weight:700;color:#303946}.box-table .team-cell{min-width:100px}.box-hint{font-size:10px;color:#8a929c;margin-top:9px;text-align:right}@media(max-width:850px){.games-grid{grid-template-columns:1fr}}@media(max-width:560px){.scores-page{padding-top:36px}.scores-tabs{gap:24px}.games-grid{gap:10px;margin-top:22px}.score-line{grid-template-columns:minmax(150px,1fr) 36px 36px 36px}.score-line>div{padding:9px 8px}.box-score{overflow-x:auto}.box-table{min-width:500px}}
</style></head><body><header class="topbar"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>KHBA</span></a><nav class="nav"><a href="index.html">HOME</a><a class="active" href="scores.html">SCORES</a><a href="standings.html">STANDINGS</a><a href="news.html">NEWS</a><a href="teams.html">TEAMS</a></nav></div></header><main class="section scores-page"><div class="container"><div class="scores-tabs"><a class="scores-tab active" href="scores.html">Scores</a><a class="scores-tab" href="schedule.html">Schedule</a></div><div class="games-grid" id="scoresGrid"></div></div></main><script src="script.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const games=[{date:'AUG 16',status:'FINAL',home:'DOOSAN BEARS',away:'LG TWINS',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:['—','—','—'],awayStats:['—','—','—'],homeInnings:['—','—','—','—','—','—','—','—','—'],awayInnings:['—','—','—','—','—','—','—','—','—']},{date:'AUG 15',status:'FINAL',home:'HANSHIN TIGERS',away:'CANBERRA CAVALRY',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:['—','—','—'],awayStats:['—','—','—'],homeInnings:['—','—','—','—','—','—','—','—','—'],awayInnings:['—','—','—','—','—','—','—','—','—']}];const row=(name,pitcher,stats)=>`<div class="score-line"><div class="score-team">${name}<small>${pitcher}</small></div><div class="score-stat">${stats[0]}</div><div class="score-stat">${stats[1]}</div><div class="score-stat">${stats[2]}</div></div>`;const boxRow=(name,innings,stats)=>`<tr><td class="team-cell">${name}</td>${innings.map(v=>`<td>${v}</td>`).join('')}<td>${stats[0]}</td><td>${stats[1]}</td><td>${stats[2]}</td></tr>`;const box=g=>`<div class="box-score"><div class="box-score-title">BOX SCORE</div><table class="box-table"><thead><tr><th>TEAM</th>${[1,2,3,4,5,6,7,8,9].map(n=>`<th>${n}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${boxRow(g.home,g.homeInnings,g.homeStats)}${boxRow(g.away,g.awayInnings,g.awayStats)}</tbody></table><div class="box-hint">VIEW BOX SCORE를 다시 누르면 닫힙니다</div></div>`;document.getElementById('scoresGrid').innerHTML=games.map(g=>`<div class="game-wrap"><article class="score-card"><div class="score-card-head"><span>${g.date} · 2026</span><span class="score-status">${g.status}</span></div><div class="score-line"><div></div><div class="score-stat-head">R</div><div class="score-stat-head">H</div><div class="score-stat-head">E</div></div>${row(g.home,g.homePitcher,g.homeStats)}${row(g.away,g.awayPitcher,g.awayStats)}<div class="score-card-footer"><div class="score-card-foot">KHBA REGULAR SEASON</div><button class="box-trigger" type="button">VIEW BOX SCORE <span>→</span></button></div></article>${box(g)}</div>`).join('');document.querySelectorAll('.box-trigger').forEach(btn=>btn.addEventListener('click',()=>{const wrap=btn.closest('.game-wrap');const willOpen=!wrap.classList.contains('open');document.querySelectorAll('.game-wrap.open').forEach(w=>{w.classList.remove('open');w.querySelector('.score-card').classList.remove('open');const b=w.querySelector('.box-trigger');if(b)b.innerHTML='VIEW BOX SCORE <span>→</span>'});if(willOpen){wrap.classList.add('open');wrap.querySelector('.score-card').classList.add('open');btn.innerHTML='CLOSE BOX SCORE <span>↑</span>'}}));});
</script></body></html>
