<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scores | KHBA</title><link rel="stylesheet" href="style.css"><style>
.score-card{background:#fff;border:1px solid #d8dde5;border-radius:4px;overflow:hidden}.score-card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #e3e6eb;font-size:12px;font-weight:700;letter-spacing:.4px;color:#657080}.score-status{color:#687383}.score-line{display:grid;grid-template-columns:minmax(190px,1fr) 42px 42px 42px;align-items:center}.score-line>div{padding:10px 14px}.score-line:not(:last-of-type){border-bottom:1px solid #edf0f3}.score-team{font-weight:800;font-size:15px;color:#202936}.score-team small{display:block;margin-top:4px;font-size:11px;font-weight:600;color:#7b8490}.score-stat-head{font-size:11px;font-weight:800;text-align:center;color:#6c7580}.score-stat{font-size:15px;font-weight:800;text-align:center}.score-card-foot{padding:10px 16px;border-top:1px solid #e3e6eb;font-size:11px;font-weight:700;color:#7b8490;letter-spacing:.3px}@media(max-width:560px){.score-line{grid-template-columns:minmax(150px,1fr) 36px 36px 36px}.score-team{font-size:13px}.score-line>div{padding:9px 8px}}
</style></head><body><header class="topbar"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>KHBA</span></a><nav class="nav"><a href="index.html">HOME</a><a class="active" href="scores.html">SCORES</a><a href="standings.html">STANDINGS</a><a href="news.html">NEWS</a><a href="teams.html">TEAMS</a></nav></div></header><main class="section scores-page"><div class="container"><div class="scores-tabs"><a class="scores-tab active" href="scores.html">Scores</a><a class="scores-tab" href="schedule.html">Schedule</a></div><div class="scores-tab-line"></div><div class="games-grid" id="scoresGrid"></div></div></main><script src="script.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const scoreGames=[
{date:'AUG 16',status:'FINAL',home:'DOOSAN BEARS',away:'LG TWINS',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:[5,8,0],awayStats:[3,6,1]},
{date:'AUG 15',status:'FINAL',home:'HANSHIN TIGERS',away:'CANBERRA CAVALRY',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:[2,5,1],awayStats:[4,7,0]},
{date:'AUG 14',status:'FINAL',home:'LG TWINS',away:'HANSHIN TIGERS',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:[6,9,1],awayStats:[6,9,1]}
];const row=(name,pitcher,stats)=>`<div class="score-line"><div class="score-team">${name}<small>${pitcher}</small></div><div class="score-stat">${stats[0]}</div><div class="score-stat">${stats[1]}</div><div class="score-stat">${stats[2]}</div></div>`;document.getElementById('scoresGrid').innerHTML=scoreGames.map(g=>`<article class="score-card"><div class="score-card-head"><span>${g.date} · 2026</span><span class="score-status">${g.status}</span></div><div class="score-line"><div></div><div class="score-stat-head">R</div><div class="score-stat-head">H</div><div class="score-stat-head">E</div></div>${row(g.home,g.homePitcher,g.homeStats)}${row(g.away,g.awayPitcher,g.awayStats)}<div class="score-card-foot">KHBA REGULAR SEASON</div></article>`).join('')});
</script></body></html>
