<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scores | KHBA</title><link rel="stylesheet" href="style.css"><style>
.scores-page{padding-top:58px}.scores-tabs{display:flex;align-items:flex-end;gap:30px;border-bottom:1px solid #d9dde1;width:max-content}.scores-tab{display:block;padding:0 1px 11px;font-size:16px;font-weight:700;line-height:1;color:#69717a}.scores-tab.active{color:#17202b;border-bottom:3px solid #2d343b;font-weight:900}.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px}.score-card{background:#fff;border:1px solid #d8dde5;border-radius:4px;overflow:hidden}.score-card-head{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #e3e6eb;font-size:12px;font-weight:700;letter-spacing:.4px;color:#657080}.score-status{color:#687383}.score-line{display:grid;grid-template-columns:minmax(190px,1fr) 42px 42px 42px;align-items:center}.score-line>div{padding:10px 14px}.score-line:not(:last-of-type){border-bottom:1px solid #edf0f3}.score-team{font-weight:800;font-size:15px;color:#202936}.score-team small{display:block;margin-top:4px;font-size:11px;font-weight:600;color:#7b8490}.score-stat-head{font-size:11px;font-weight:800;text-align:center;color:#6c7580}.score-stat{font-size:15px;font-weight:800;text-align:center}.score-card-foot{padding:10px 16px;border-top:1px solid #e3e6eb;font-size:11px;font-weight:700;color:#7b8490;letter-spacing:.3px}.box-toggle{width:100%;border:0;border-top:1px solid #e3e6eb;background:#fafbfc;padding:9px 16px;text-align:left;font-size:11px;font-weight:900;letter-spacing:.6px;color:#3d4753;cursor:pointer}.box-toggle:hover{background:#f1f3f5}.box-view{padding:14px 16px}.box-view-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.box-view-title{font-size:12px;font-weight:900;letter-spacing:.8px;color:#303946}.score-back{border:1px solid #d8dde5;background:#fff;padding:5px 10px;border-radius:3px;font-size:10px;font-weight:800;color:#55606d;cursor:pointer}.box-table{width:100%;border-collapse:collapse;font-size:12px}.box-table th,.box-table td{text-align:center;padding:8px 4px;border-top:1px solid #e2e6ea}.box-table th{font-size:10px;color:#6c7580;font-weight:800}.box-table th:first-child,.box-table td:first-child{text-align:left;font-weight:800;padding-left:0}.box-table td{font-weight:700;color:#303946}.box-table .team-cell{min-width:100px}@media(max-width:850px){.games-grid{grid-template-columns:1fr}.score-line{grid-template-columns:minmax(190px,1fr) 42px 42px 42px}}@media(max-width:560px){.scores-page{padding-top:36px}.scores-tabs{gap:24px}.games-grid{gap:10px;margin-top:22px}.score-team{font-size:13px}.score-line{grid-template-columns:minmax(150px,1fr) 36px 36px 36px}.score-line>div{padding:9px 8px}.box-view{overflow-x:auto}.box-table{min-width:500px}}
</style></head><body><header class="topbar"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>KHBA</span></a><nav class="nav"><a href="index.html">HOME</a><a class="active" href="scores.html">SCORES</a><a href="standings.html">STANDINGS</a><a href="news.html">NEWS</a><a href="teams.html">TEAMS</a></nav></div></header><main class="section scores-page"><div class="container"><div class="scores-tabs"><a class="scores-tab active" href="scores.html">Scores</a><a class="scores-tab" href="schedule.html">Schedule</a></div><div class="games-grid" id="scoresGrid"></div></div></main><script src="script.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const games=[
{date:'AUG 16',status:'FINAL',home:'DOOSAN BEARS',away:'LG TWINS',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:['—','—','—'],awayStats:['—','—','—'],homeInnings:['—','—','—','—','—','—','—','—','—'],awayInnings:['—','—','—','—','—','—','—','—','—']},
{date:'AUG 15',status:'FINAL',home:'HANSHIN TIGERS',away:'CANBERRA CAVALRY',homePitcher:'Starting Pitcher · —',awayPitcher:'Starting Pitcher · —',homeStats:['—','—','—'],awayStats:['—','—','—'],homeInnings:['—','—','—','—','—','—','—','—','—'],awayInnings:['—','—','—','—','—','—','—','—','—']}
];const row=(name,pitcher,stats)=>`<div class="score-line"><div class="score-team">${name}<small>${pitcher}</small></div><div class="score-stat">${stats[0]}</div><div class="score-stat">${stats[1]}</div><div class="score-stat">${stats[2]}</div></div>`;const card=g=>`<div class="score-card-head"><span>${g.date} · 2026</span><span class="score-status">${g.status}</span></div><div class="score-line"><div></div><div class="score-stat-head">R</div><div class="score-stat-head">H</div><div class="score-stat-head">E</div></div>${row(g.home,g.homePitcher,g.homeStats)}${row(g.away,g.awayPitcher,g.awayStats)}<div class="score-card-foot">KHBA REGULAR SEASON</div><button class="box-toggle" type="button">BOX</button>`;const boxRow=(name,innings,stats)=>`<tr><td class="team-cell">${name}</td>${innings.map(v=>`<td>${v}</td>`).join('')}<td>${stats[0]}</td><td>${stats[1]}</td><td>${stats[2]}</td></tr>`;const box=g=>`<div class="score-card-head"><span>${g.date} · 2026</span><span class="score-status">${g.status}</span></div><div class="box-view"><div class="box-view-top"><span class="box-view-title">BOX SCORE</span><button class="score-back" type="button">SCORES</button></div><table class="box-table"><thead><tr><th>TEAM</th>${[1,2,3,4,5,6,7,8,9].map(n=>`<th>${n}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr></thead><tbody>${boxRow(g.home,g.homeInnings,g.homeStats)}${boxRow(g.away,g.awayInnings,g.awayStats)}</tbody></table></div><div class="score-card-foot">KHBA REGULAR SEASON</div>`;const grid=document.getElementById('scoresGrid');grid.innerHTML=games.map((g,i)=>`<article class="score-card" data-index="${i}">${card(g)}</article>`).join('');grid.addEventListener('click',e=>{const article=e.target.closest('.score-card');if(!article)return;const g=games[article.dataset.index];if(e.target.closest('.box-toggle'))article.innerHTML=box(g);if(e.target.closest('.score-back'))article.innerHTML=card(g)});});
</script></body></html>
